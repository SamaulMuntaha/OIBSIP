
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A functional calculator built with HTML5, CSS3 and JavaScript">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="calculator">
        <h1>Calculator</h1>
        <p class="subtitle">Simple & Smart Calculation</p>

        <div class="display" aria-live="polite">
            <div id="previous-display"></div>
            <div id="current-display">0</div>
        </div>

        <div class="buttons">
            <button type="button" class="function" data-action="clear">C</button>
            <button type="button" class="function" data-action="delete">DEL</button>
            <button type="button" class="operator" data-operator="/">÷</button>
            <button type="button" class="operator" data-operator="*">×</button>

            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
            <button type="button" class="operator" data-operator="-">−</button>

            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" class="operator" data-operator="+">+</button>

            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" class="equals" data-action="calculate">=</button>

            <button type="button" class="zero" data-number="0">0</button>
            <button type="button" data-number=".">.</button>
        </div>
    </main>

</body>
</html>
